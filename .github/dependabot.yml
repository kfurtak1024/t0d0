version: 2
updates:
  # Nothing here can reach the shipped page — the app has no runtime dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        patterns: ["*"]
    ignore:
      # typescript-eslint peers on typescript <6.1, so anything at or above that
      # makes the whole group uninstallable and npm ci fails on ERESOLVE. The
      # bound mirrors that peer range rather than blocking majors: 6.x stops at
      # 6.0.3 today, but a 6.1 would be a minor, and a minor would sail through.
      # Drop this once typescript-eslint ships support for the Go rewrite.
      - dependency-name: typescript
        versions: [">=6.1.0"]

  - package-ecosystem: github-actions
    # `/` covers .github/workflows only. The shared gate is a composite action
    # in its own directory, so it has to be named or the actions it pins — the
    # cache, setup-node, upload-artifact — are never updated.
    directories:
      - /
      - /.github/actions/verify
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
