version: 2
updates:
  # Nothing here can reach the shipped page — the app has no runtime dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dev-dependencies:
        patterns: ["*"]
    ignore:
      # typescript-eslint peers on typescript <6.1, so a TypeScript 7 bump makes
      # the whole group uninstallable and npm ci fails on ERESOLVE. Drop this
      # once typescript-eslint ships support for the Go rewrite.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
