name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A follow-up push cancels the in-flight run rather than racing it to the CDN.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint, typecheck, unit tests
        run: npm run check

      - name: Coverage thresholds
        run: npm run test:coverage

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Check bundle budget
        run: |
          size=$(find dist/assets -name '*.js' -o -name '*.css' | xargs cat | gzip -9 | wc -c)
          echo "gzipped assets: ${size} bytes"
          if [ "$size" -gt 61440 ]; then
            echo "::error::bundle is over the 60 KB budget — did a dependency sneak in?"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publish to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
