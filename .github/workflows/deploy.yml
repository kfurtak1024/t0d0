name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time. Runs queued behind the in-flight one collapse to the
# newest, but the in-flight one is never cancelled: killing a run part-way
# through publishing can leave the Pages deployment stuck.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Read-only, and deliberately not pages:write — this job runs npm ci and the
    # whole test toolchain, and has no business holding a token that can publish.
    # configure-pages only reads the site's metadata (enablement defaults false).
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/verify
        with:
          artifact-suffix: deploy

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Publish to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that can publish, and it does nothing else.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
