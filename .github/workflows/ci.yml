name: CI

on:
  pull_request:
  workflow_dispatch:
  # The app has no runtime dependencies and does not rot. The toolchain does — a
  # Playwright browser update, a runner image change, an apt package that goes
  # away. Without this you find out on the morning you need to ship something.
  #
  # Mid-month on purpose, so it does not land with Dependabot's monthly batch and
  # leave you guessing which one broke. The odd minute is on purpose too: runs
  # scheduled on the hour queue behind everyone else's and are the ones GitHub
  # drops first under load.
  #
  # Delivery is best-effort either way — a scheduled run can be late or skipped,
  # so treat a missing run as noise and a failing one as signal. GitHub also
  # disables schedules after 60 days without repository activity; a push
  # re-enables them.
  schedule:
    - cron: "37 6 15 * *"

permissions:
  contents: read

# A newer push to the same pull request makes the in-flight run irrelevant.
# Nothing here deploys, so cancelling it costs nothing.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/verify
        with:
          artifact-suffix: ci
          e2e-project: none

  # One job per browser, side by side. As one job the four ran back to back on
  # two workers, and the gate took as long as all of them together; split, it
  # takes as long as the slowest. Not fail-fast: a WebKit-only failure is worth
  # seeing next to a green Chromium, not instead of it.
  e2e:
    name: End-to-end (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [desktop-chromium, desktop-webkit, mobile-safari, desktop-firefox]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/verify
        with:
          artifact-suffix: ci-${{ matrix.project }}
          check: "false"
          e2e-project: ${{ matrix.project }}

  verify:
    # This name is the required status check on main. Renaming it stops the rule
    # matching, and every pull request then waits for a check that never reports
    # — so change it here and in the ruleset together, or not at all.
    #
    # It no longer does the work; it reports on the jobs that do. `always()` so
    # it reports red when one of them failed rather than being skipped — a
    # skipped required check is one GitHub can treat as passing.
    name: Lint, typecheck, test
    needs: [check, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part of the gate passed
        shell: bash
        run: |
          echo "check: ${{ needs.check.result }}, end-to-end: ${{ needs.e2e.result }}"
          test "${{ needs.check.result }}" = success
          test "${{ needs.e2e.result }}" = success
