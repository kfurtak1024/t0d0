name: Verify
description: The full gate — lint, typecheck, tests, end-to-end, and the bundle budget.

# Both workflows run exactly this, so the gate a pull request clears and the gate
# a deploy clears cannot drift apart.
#
# A composite action rather than a reusable workflow on purpose: a reusable
# workflow renames the check run to "<caller job> / <called job>", and this
# repository's ruleset requires a status check by name. The name has to stay
# "Lint, typecheck, test" or every pull request waits forever for a check that
# no longer reports under that name.
#
# The cost of that choice is visibility: all of this reports as one step in the
# job UI and in the API, so a slow run is undiagnosable without reading the whole
# log. Hence the clock stamps below, rendered into the job summary at the end.

inputs:
  artifact-suffix:
    description: Distinguishes the uploads when both workflows run this gate.
    required: true

runs:
  using: composite
  steps:
    - name: Begin timings
      shell: bash
      run: echo "$(date +%s) start" > "$RUNNER_TEMP/phases"

    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        cache: npm

    - shell: bash
      run: echo "$(date +%s) setup node" >> "$RUNNER_TEMP/phases"

    - shell: bash
      run: |
        npm ci
        echo "$(date +%s) npm ci" >> "$RUNNER_TEMP/phases"

    # Zero runtime dependencies is the first hard constraint in CLAUDE.md, and
    # until now nothing enforced it.
    - name: No runtime dependencies
      shell: bash
      run: |
        node -e '
          const deps = require("./package.json").dependencies ?? {};
          const names = Object.keys(deps);
          if (names.length > 0) {
            console.error("::error::runtime dependencies are not allowed: " + names.join(", "));
            process.exit(1);
          }
        '

    - name: Lint, format, typecheck, unit tests, coverage thresholds
      shell: bash
      run: |
        npm run check
        echo "$(date +%s) npm run check" >> "$RUNNER_TEMP/phases"

    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: coverage-${{ inputs.artifact-suffix }}
        path: coverage/
        retention-days: 7

    # The browser install is the most variable step in the gate — 50s to 222s
    # across recent runs — and the binaries only change when Playwright does.
    - name: Playwright version
      id: playwright
      shell: bash
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v6
      id: browsers
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    - shell: bash
      run: echo "$(date +%s) cache restore (hit=${{ steps.browsers.outputs.cache-hit == 'true' }})" >> "$RUNNER_TEMP/phases"

    - name: Install browsers
      if: steps.browsers.outputs.cache-hit != 'true'
      shell: bash
      run: npx playwright install --with-deps chromium webkit

    # The apt packages live outside the cached directory, so a hit still needs
    # them. The cache saves the download, not the system dependencies.
    - name: Install browser system dependencies
      if: steps.browsers.outputs.cache-hit == 'true'
      shell: bash
      run: npx playwright install-deps chromium webkit

    - shell: bash
      run: echo "$(date +%s) browsers ready" >> "$RUNNER_TEMP/phases"

    - name: End-to-end tests
      shell: bash
      # A test that only passes on retry is a bug, not weather.
      run: |
        npm run test:e2e -- --fail-on-flaky-tests
        echo "$(date +%s) end-to-end tests" >> "$RUNNER_TEMP/phases"

    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report-${{ inputs.artifact-suffix }}
        path: playwright-report/
        retention-days: 7

    - name: Build
      shell: bash
      run: |
        npm run build
        echo "$(date +%s) build" >> "$RUNNER_TEMP/phases"

    # Runs here rather than only before a deploy: with main protected, a check
    # that can only fail after the merge fails in the one place nothing can be
    # done about it.
    #
    # All of dist, not just dist/assets — vite-plugin-pwa emits the service worker
    # and Workbox's precache runtime at the root, and a browser downloads those
    # like everything else. Measuring assets alone hid 5 kB of them.
    #
    # The limit sits a little above the real size rather than far above it, so
    # growth is a decision someone makes rather than something that just happens.
    # Raising it is fine — but the README badge states this number, so move both.
    #
    # `sort` because the files are concatenated before gzip, so the order they
    # arrive in changes how well the whole thing compresses — 66 bytes between
    # find's order and sorted order, which is real money against a threshold this
    # tight. find makes no promise about order across filesystems, so without
    # this the same commit can measure differently on two machines.
    - name: Check bundle budget
      shell: bash
      run: |
        limit=30720
        size=$(find dist -name '*.js' -o -name '*.css' | sort | xargs cat | gzip -9 | wc -c)
        echo "gzipped js and css: ${size} of ${limit} bytes"
        if [ "$size" -gt "$limit" ]; then
          echo "::error::bundle is ${size} bytes, over the 30 kB budget — did a dependency sneak in?"
          exit 1
        fi

    # Where the time went, on the job summary rather than buried in the log.
    # Runs even when the gate failed: a slow run and a broken run are often the
    # same run, and the timings are how you tell which phase to look at.
    - name: Timings
      if: ${{ !cancelled() }}
      shell: bash
      run: |
        {
          echo "### Gate timings"
          echo
          echo "| phase | seconds |"
          echo "| --- | ---: |"
          prev=""
          while read -r ts label; do
            if [ -n "$prev" ]; then
              echo "| ${label} | $((ts - prev)) |"
            fi
            prev="$ts"
          done < "$RUNNER_TEMP/phases"
        } >> "$GITHUB_STEP_SUMMARY"
